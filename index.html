<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <title>需求排期台</title>
    <meta name="description" content="需求从提出到上线的排期与推进管理" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Crect x='7' y='9' width='13' height='4' rx='2' fill='white'/%3E%3Crect x='11' y='15' width='14' height='4' rx='2' fill='white' opacity='.75'/%3E%3Crect x='8' y='21' width='9' height='4' rx='2' fill='white' opacity='.55'/%3E%3C/svg%3E"
    />
    <script>
      // 首屏前先把主题定下来，避免浅色闪一下
      try {
        var raw = localStorage.getItem('demand-scheduler.state.v1')
        var theme = raw ? (JSON.parse(raw).settings || {}).theme : 'light'
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light')
      } catch (e) {}
    </script>

          color: #8b8b96;
          font-size: 13px;
          letter-spacing: 0.02em;
        "
      >
        正在加载需求排期台…
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
